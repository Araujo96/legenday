name: release

# Monta o executável do Windows e, ao publicar uma versão (tag v*), anexa o .zip à página de Releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # também dá para rodar à mão, na aba Actions, para testar antes de publicar

permissions:
  contents: write

# Versões fixas do libmpv e do ffmpeg: a build não muda sozinha de um dia para o outro, e o SHA-256 garante que o
# arquivo baixado é exatamente o que foi testado.
# Para atualizar: escolha a release nova em github.com/shinchiro/mpv-winbuild-cmake/releases (mpv-dev-x86_64-...7z)
# ou github.com/BtbN/FFmpeg-Builds/releases (ffmpeg-n<versão>-...-win64-lgpl-<versão>.zip), troque a URL e
# calcule o novo hash com:  certutil -hashfile arquivo SHA256   (ou sha256sum arquivo).
# Atenção: o BtbN apaga builds "autobuild-..." antigos depois de algumas semanas; se o download do ffmpeg der 404,
# é só atualizar para um build recente.
env:
  MPV_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-dev-x86_64-20261111-git-bcde6b93cc.7z
  MPV_SHA256: 273c079b11ea5575822f972756f4c9a71149a5c10130353abeb8586738938452
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-16-15-29/ffmpeg-n8.1.3-35-gf1acb0a266-win64-lgpl-8.1.zip
  FFMPEG_SHA256: 8816920f141720edb654232c999fbeb5eab51ee957dd3687c5287bfb6388ddf9

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Baixar e conferir libmpv e ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force libs, tmp | Out-Null
          function Get-Checked($url, $sha, $out) {
            Invoke-WebRequest $url -OutFile $out
            $got = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $sha) { throw "Hash diferente para $url`n esperado $sha`n recebido $got" }
          }
          Get-Checked $env:MPV_URL $env:MPV_SHA256 tmp\mpv.7z
          7z e tmp\mpv.7z libmpv-2.dll -r -olibs -y
          if (-not (Test-Path libs\libmpv-2.dll)) { throw "libmpv-2.dll nao encontrado no arquivo baixado" }
          Get-Checked $env:FFMPEG_URL $env:FFMPEG_SHA256 tmp\ffmpeg.zip
          Expand-Archive tmp\ffmpeg.zip -DestinationPath tmp\ffmpeg
          $exe = Get-ChildItem tmp\ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName libs\ffmpeg.exe

      - name: Montar o executável
        run: pyinstaller packaging/legenday.spec --noconfirm

      - name: Autoteste do executável
        shell: pwsh
        run: |
          $p = Start-Process "dist\legenDay\legenDay.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "dist\legenDay\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "O autoteste do executavel falhou" }

      - name: Compactar
        shell: pwsh
        run: |
          Remove-Item dist\legenDay\selftest.txt -ErrorAction SilentlyContinue
          Copy-Item packaging\LEIA-ME.txt dist\legenDay\LEIA-ME.txt
          Compress-Archive -Path dist\legenDay -DestinationPath legenDay-windows-x64.zip

      - name: Montar o instalador (legenDay-Setup.exe)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = python -c "import legenday; print(legenday.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" packaging\legenday.iss
          if ($LASTEXITCODE -ne 0) { throw "O Inno Setup falhou" }
          Move-Item dist\legenDay-Setup.exe legenDay-Setup.exe

      - name: Testar o instalador (instala, abre o autoteste e desinstala)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\legenday-instalado"
          $p = Start-Process .\legenDay-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/TASKS=","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "O instalador falhou ($($p.ExitCode))" }
          $t = Start-Process "$dir\legenDay.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$dir\selftest.txt"
          if ($t.ExitCode -ne 0) { throw "O app instalado falhou no autoteste" }
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait

      - uses: actions/upload-artifact@v4
        with:
          name: legenDay-windows-x64
          path: |
            legenDay-Setup.exe
            legenDay-windows-x64.zip

      - name: Publicar na página de Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            legenDay-Setup.exe
            legenDay-windows-x64.zip
          generate_release_notes: true
