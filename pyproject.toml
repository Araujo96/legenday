[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legenday"
dynamic = ["version"]          # vem de src/legenday/__init__.py (um lugar só)
description = "Pratique inglês assistindo filmes: clique nas palavras da legenda e veja a tradução."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "python-mpv>=1.0.5",
    "pysubs2>=1.6",
    "simplemma>=1.0",
    "segno>=1.6",
]

[project.optional-dependencies]
offline = ["argostranslate>=1.9"]      # tradução offline (opcional)
embedded = ["imageio-ffmpeg>=0.5"]     # ffmpeg para ler legendas embutidas (opcional)
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6"]

[project.gui-scripts]
legenday = "legenday.app:main"

[tool.setuptools.dynamic]
version = { attr = "legenday.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legenday = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# erros, avisos, bugs comuns (bugbear), modernização e imports ordenados
select = ["E", "W", "F", "B", "UP", "I"]
ignore = [
    "B023",   # lambdas em laços com valor padrão (t=t) são intencionais nos menus do Qt
]

[tool.ruff.lint.per-file-ignores]
"packaging/*.spec" = ["F821"]   # nomes injetados pelo PyInstaller (Analysis, PYZ, EXE...)
